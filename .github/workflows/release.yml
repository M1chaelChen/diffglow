name: Release alpha

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA (must equal the selected main HEAD)
        required: true
        type: string
      expected_version:
        description: Reviewed alpha version from package.json
        required: true
        default: 0.1.0-alpha.3
        type: string
      publish_to_npm:
        description: Publish after GitHub environment approval, then verify npm and create the prerelease; false only checks
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: diffglow-npm-alpha
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the canonical repository and exact reviewed main commit
        id: release
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const { EXPECTED_SHA: sha, EXPECTED_VERSION: version } = process.env;
          if (process.env.GITHUB_REPOSITORY !== 'M1chaelChen/diffglow' || event.repository.fork) {
            throw new Error('Releases are restricted to M1chaelChen/diffglow.');
          }
          if (event.repository.private || event.repository.default_branch !== 'main') {
            throw new Error('The public repository must use main as its default branch.');
          }
          if (process.env.GITHUB_REF !== 'refs/heads/main' ||
              process.env.GITHUB_WORKFLOW_REF !== 'M1chaelChen/diffglow/.github/workflows/release.yml@refs/heads/main') {
            throw new Error('Dispatch release.yml from main after reviewing the release commit.');
          }
          if (!/^[a-f0-9]{40}$/.test(sha ?? '') || sha !== process.env.GITHUB_SHA) {
            throw new Error('expected_sha must be the full reviewed main HEAD selected for this dispatch.');
          }
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-alpha\.(0|[1-9]\d*)$/.test(version ?? '')) {
            throw new Error('Only explicit alpha versions such as 0.1.0-alpha.3 can be released.');
          }
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'diffglow' || pkg.version !== version || pkg.private === true) {
            throw new Error('package.json must describe the reviewed public diffglow alpha version.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nversion=${version}\n`);
          NODE

  prepare:
    name: Prepare the canonical release candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the release npm version
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Prepare and audit the release candidate once
        run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release/${{ needs.validate.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [validate, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the release npm version
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Download the exact canonical candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/diffglow-candidate/
      - name: Check source, examples, clean installed package, and public contents
        env:
          DIFFGLOW_TARBALL: ${{ runner.temp }}/diffglow-candidate/diffglow-${{ needs.validate.outputs.version }}.tgz
        run: npm run release:prepare
      - name: Retain this platform's release review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-review-${{ runner.os }}-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: artifacts/release/${{ needs.validate.outputs.version }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Approve and publish npm alpha
    if: inputs.publish_to_npm
    needs: [validate, prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      NODE_AUTH_TOKEN: ''
      NPM_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release/${{ needs.validate.outputs.version }}/
      - name: Publish the exact audited candidate using OIDC
        run: npm run release:publish

  registry:
    name: Verify fresh npm registry installation
    if: inputs.publish_to_npm
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release/${{ needs.validate.outputs.version }}/
      - run: npm run release:verify-registry
      - uses: actions/upload-artifact@v4
        with:
          name: registry-verification-attempt${{ github.run_attempt }}
          path: artifacts/release/${{ needs.validate.outputs.version }}/registry-verification.json
          if-no-files-found: error

  github:
    name: Create verified GitHub prerelease
    if: inputs.publish_to_npm
    needs: [validate, registry]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release/${{ needs.validate.outputs.version }}/
      - run: npm run release:github

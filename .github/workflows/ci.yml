name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source, examples, and installed release package
        run: npm run verify
      - name: Upload package validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffglow-${{ runner.os }}-node-${{ matrix.node }}
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14
